# =============================================================================
# WhisperJAV - pyproject.toml
# =============================================================================
# Modern Python packaging configuration with modular extras and platform support.
# This is the single source of truth for package metadata and dependencies.
#
# Installation examples:
#   pip install whisperjav              # Core only (minimal)
#   pip install whisperjav[cli]         # CLI with audio processing
#   pip install whisperjav[gui]         # GUI support
#   pip install whisperjav[translate]   # Translation module
#   pip install whisperjav[all]         # Everything
#   pip install whisperjav[colab]       # Google Colab optimized
#
# Migration: This replaces the monolithic setup.py dependency list with
# modular extras that allow users to install only what they need.
# =============================================================================

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

# -----------------------------------------------------------------------------
# Project Metadata
# -----------------------------------------------------------------------------
[project]
name = "whisperjav"
dynamic = ["version"]
description = "Japanese Adult Video Subtitle Generator with AI-powered transcription"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "MeiZhong"}]
maintainers = [{name = "MeiZhong"}]
# v1.10.0: Python 3.13 only (owner, REQ2). The lower bound also stops a 1.9.x
# `whisperjav-upgrade` on Python 3.10 from installing 1.10 out of `main`.
requires-python = ">=3.13,<3.14"
keywords = [
    "whisper",
    "transcription",
    "subtitles",
    "japanese",
    "audio",
    "speech-to-text",
    "asr",
    "stable-ts",
    "faster-whisper",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Multimedia :: Video",
]

# -----------------------------------------------------------------------------
# Core Dependencies (Minimal for basic operation)
# -----------------------------------------------------------------------------
# These are the essential dependencies needed for the most basic functionality.
# Users who want more features should install the appropriate extras.
dependencies = [
    # Whisper backends (core ASR engines)
    "openai-whisper @ git+https://github.com/openai/whisper@main",
    "stable-ts @ git+https://github.com/meizhong986/stable-ts-fix-setup.git@main",
    # v1.9.2: EXACT pins, not ranges.
    #
    # faster-whisper is pinned to a COMMIT, not to the 1.2.1 release. The three
    # commits after the v1.2.1 tag are the ones we need: #1390 replaces the bundled
    # Silero weights with v6.2, #1386 adds VAD parameters, #1389 drops a deprecated
    # download argument. Pinning the commit rather than the branch keeps every
    # install reproducible -- the branch moves, this does not.
    #
    # CTranslate2 4.6.2 reproduces the #125 crash on exit (0xC0000409); 4.8.1 does not.
    "faster-whisper @ git+https://github.com/SYSTRAN/faster-whisper.git@ed9a06cd89a93e47838f564998a6c09b655d7f43",
    # v1.10.0: 4.8.3 (#459), taken without measurement (owner, W36 (4)). It has no
    # CUDA 13 build; on Windows it runs on the cuBLAS 12 DLLs the installer places
    # in its package folder.
    "ctranslate2==4.8.3",

    # Audio/video handling
    "ffmpeg-python @ git+https://github.com/kkroening/ffmpeg-python.git",

    # Subtitle processing
    "pysrt",
    "srt",

    # Utilities
    "tqdm",
    "colorama",
    "requests",
    "aiofiles",
    "regex",
    "tiktoken>=0.7.0",       # Tokenizer for Whisper (explicit for --no-deps safety)
    "more-itertools>=10.0",  # Transitive dep of openai-whisper (explicit for --no-deps safety)

    # Configuration system
    "pydantic>=2.0,<3.0",
    "PyYAML>=6.0",
    "jsonschema",
]

# -----------------------------------------------------------------------------
# Optional Dependencies (Extras)
# -----------------------------------------------------------------------------
# Each extra represents a feature set that users can opt into.
# Platform markers (sys_platform) ensure Windows-only deps aren't installed elsewhere.

[project.optional-dependencies]

# PyTorch versions (the build -- cu130, cu128 or cpu -- comes from the extras below)
# Install with: pip install whisperjav[torch]
torch = [
    # v1.10.0: pinned. torchaudio has no release after 2.11.0, so PyTorch stays
    # there; the CUDA build (cu130, or cu128 as the per-PC fallback) is chosen by
    # the installer.
    "torch==2.11.0",
    "torchaudio==2.11.0",
]

# v1.10.0 (item 2f; design section 22, owner W234/W238): one extra per install, never mixed
# ([tool.uv] conflicts); each takes torch and torchaudio from its own index ([tool.uv.sources]).
#   cu130   NVIDIA GPU (CUDA 13.0), Windows default
#   cu128   NVIDIA GPU (CUDA 12.8): the Windows per-PC fallback; Linux (owner, W45)
#   vulkan  GPU through Vulkan (AMD, Intel or older NVIDIA card), Windows only; also Own PyTorch on
#           Windows, installed without torch and torchaudio
#   cpu     CPU only; the Apple GPU (Metal) install on Apple silicon (that index carries the Apple
#           wheels); Own PyTorch on Linux and Mac, installed without torch and torchaudio
# v1.10.0 (item 3, owner W78 C2): torchvision left with ClearVoice, its only user.
# CrispASR's Python package (route B, owner W176-W178), one line per platform in each extra: the
# CUDA build (+cuda, its own CUDA 12.8 libraries inside) and the Vulkan build (+vulkan) from the
# v0.8.44 GitHub release, each pinned by URL and SHA-256 (decision record D10; the hashes equal the
# release's own digests); everywhere else PyPI's build (CPU on Windows and Linux, Metal inside on
# Apple silicon; owner W217 13, W217 15, W225).
cu130 = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "crispasr @ https://github.com/CrispStrobe/CrispASR/releases/download/v0.8.44/crispasr-0.8.44%2Bcuda-py3-none-win_amd64.whl#sha256=9be6897bdce3276d8d98253ec2cfd474963fd8b695431fbce988498e97f95e39 ; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "crispasr @ https://github.com/CrispStrobe/CrispASR/releases/download/v0.8.44/crispasr-0.8.44%2Bcuda-py3-none-manylinux_2_35_x86_64.whl#sha256=1da4ce56f957da29b2d931163fbcddd27eb24e19e8cf2cc9ee3bb0a049ba2c7f ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "crispasr==0.8.44 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
cu128 = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "crispasr @ https://github.com/CrispStrobe/CrispASR/releases/download/v0.8.44/crispasr-0.8.44%2Bcuda-py3-none-win_amd64.whl#sha256=9be6897bdce3276d8d98253ec2cfd474963fd8b695431fbce988498e97f95e39 ; sys_platform == 'win32' and platform_machine == 'AMD64'",
    "crispasr @ https://github.com/CrispStrobe/CrispASR/releases/download/v0.8.44/crispasr-0.8.44%2Bcuda-py3-none-manylinux_2_35_x86_64.whl#sha256=1da4ce56f957da29b2d931163fbcddd27eb24e19e8cf2cc9ee3bb0a049ba2c7f ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "crispasr==0.8.44 ; sys_platform == 'linux' and platform_machine == 'aarch64'",
]
vulkan = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "crispasr @ https://github.com/CrispStrobe/CrispASR/releases/download/v0.8.44/crispasr-0.8.44%2Bvulkan-py3-none-win_amd64.whl#sha256=f6f71430ee379ac728ff6721d9394c54fd2cf67e0d9973e3e11cb63ba4366522 ; sys_platform == 'win32' and platform_machine == 'AMD64'",
]
cpu = [
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "crispasr==0.8.44 ; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64') or (sys_platform == 'linux' and platform_machine == 'aarch64') or (sys_platform == 'darwin' and platform_machine == 'arm64')",
]

# CLI audio processing features
# Install with: pip install whisperjav[cli]
cli = [
    # PyTorch dependency (GPU wheels via named index)
    "whisperjav[torch]",

    # Audio I/O
    "soundfile",
    "pydub",
    # v1.10.0 (item 3): pydub imports audioop, which Python 3.13 no longer has. It came in
    # through gradio (qwen-asr 0.0.6's demo programs) until the fork dropped them.
    "audioop-lts",

    # Scientific computing
    # numpy, v1.10.0 (owner, W44: plan ahead for MOSS and the other roadmap items).
    # PyPI metadata read 2026-10-14: numba 0.68 (the newest) needs numpy <2.6; MOSS-
    # Transcribe-Diarize (GitHub pyproject) >=1.26,<3; crispasr >=1.20; transformers 5
    # >=1.17; nemo_toolkit 3.0 >=1.22; scipy 1.18 <2.8; librosa 1.0 >=2.1; numpy 2.5
    # needs Python >=3.12. 2.5.x satisfies all of them. funasr-onnx caps numpy at
    # 1.26.4, which has no Python 3.13 wheels, so SenseVoice (R05) would come through funasr
    # or CrispASR instead. Raise the upper bound only together with numba.
    "numpy>=2.5,<2.6",
    "scipy>=1.13.0",

    # Audio analysis
    "librosa>=0.11.0",
    "pyloudnorm",

    # Voice Activity Detection
    "auditok",
    "silero-vad>=6.2",
    "ten-vad",
    "fireredvad>=0.0.2",  # v1.9.2: FireRedVAD speech segmenter ships by default

    # Performance and utilities

    "numba>=0.61.0",
    "psutil>=5.9.0",

    # Scene detection clustering
    "scikit-learn>=1.4.0",
]

# GUI dependencies (platform-aware)
# Install with: pip install whisperjav[gui]
gui = [
    "pywebview>=5.0.0",
    # Windows-only dependencies (skipped on Linux/macOS)
    "pythonnet>=3.0; sys_platform == 'win32'",
    "pywin32>=305; sys_platform == 'win32'",
]

# Translation module
# Install with: pip install whisperjav[translate]
translate = [
    "pysubtrans>=1.5.0",  # AI subtitle translation (requires Python 3.10+)
    "openai>=1.35.0",     # GPT provider
    "google-genai>=1.39.0",  # Gemini provider
    "google-api-core>=2.14.0",  # Required by pysubtrans Gemini provider (undeclared transitive dep)
]

# Speech enhancement backends
# Install with: pip install whisperjav[enhance]
#
# LINUX USERS: You also need system package libsndfile1:
#   sudo apt-get install libsndfile1  (Debian/Ubuntu)
#   sudo dnf install libsndfile       (Fedora/RHEL)
#
# VERSION NOTES:
# - datasets: v1.10.0 (item 3). ModelScope's pipeline module imports it (ZipEnhancer
#   needs it); ModelScope 1.40 declares datasets >=4.0.0,<=4.8.4 in its extras, which
#   WhisperJAV does not install, so the same range is stated here. datasets 4.8.4
#   caps huggingface-hub below 2.0.
# - modelscope: >=1.40 (the first release that accepts datasets 4.x).
# - setuptools: Required by modelscope at runtime (uses pkg_resources in utils/plugins.py)
# - einops: Required by modelscope framework for tensor operations
enhance = [
    # ModelScope (ZipEnhancer) - core framework
    "modelscope>=1.40",
    # setuptools: modelscope uses pkg_resources at runtime (not just build-time)
    # setuptools 82.0.0 removed pkg_resources — pin to <82 until modelscope migrates
    "setuptools>=61.0,<82",
    # einops: tensor operations required by modelscope framework
    "einops",
    # oss2: Alibaba Cloud OSS SDK - required by ModelScope to download models
    "oss2",
    "addict",
    "attrs",  # Required by modelscope framework
    "datasets>=4.0.0,<=4.8.4",  # ModelScope's tested range (see VERSION NOTES)
    "simplejson",
    "sortedcontainers",
    "packaging",
    "Pillow",  # Required by modelscope framework

    # v1.10.0 (item 3, owner W73): ClearVoice is no longer included, and with it
    # gdown, opencv-python, python-speech-features, scenedetect, torchinfo and
    # yamlargparse. joblib (scikit-learn) and rotary-embedding-torch (BS-RoFormer)
    # are still needed by others.
    "joblib",

    # BS-RoFormer vocal isolation
    "bs-roformer-infer",
    "rotary-embedding-torch>=0.8",

    # htdemucs vocal isolation (Demucs v4). Owner's decision, 2026-09-17 (second
    # decision, replacing the first): an ordinary dependency like any other, not
    # something the user installs by hand. It adds three packages -- demucs,
    # lameenc and sphn -- and does not touch torch, and all three have wheels for
    # every Python WhisperJAV declares (3.10-3.13) on Windows, Linux and macOS,
    # so nothing has to be built.
    "demucs",

    # ONNX inference
    "onnxruntime>=1.16.0",

    # ModelScope framework requires transformers; pull via huggingface extra
    "whisperjav[huggingface]",
]

# HuggingFace ecosystem (for kotoba-whisper, model downloads)
# Install with: pip install whisperjav[huggingface]
huggingface = [
    # v1.10.0 (item 3): huggingface-hub 2.x waits on datasets (see [enhance]).
    "huggingface-hub>=1.0,<2",
    # v1.10.0 (item 3, owner W76, W78): 5.20 is the first release with every model
    # class the 1.10.x roadmap names (qwen3_asr 5.13, cohere_asr 5.4, vibevoice_asr
    # 5.3, Parakeet TDT 5.10, canary 5.17, MOSS-Transcribe-Diarize 5.20). Qwen3-ASR
    # itself runs through the qwen-asr fork ([qwen]). The lock fixes the exact version.
    "transformers>=5.20,<6",
    "accelerate>=1.15",
    "hf_xet",  # Faster HuggingFace downloads
]

# WhisperSeg ONNX speech segmenter (v1.8.12+)
# Install with: pip install whisperjav[whisperseg]
# Backend: TransWithAI/Whisper-Vad-EncDec-ASMR-onnx (MIT, 119 MB on first run)
# Note: CPU-only. For CUDA, use whisperjav[whisperseg-gpu] instead.
whisperseg = [
    "onnxruntime>=1.16.0",
    "whisperjav[huggingface]",  # transformers (WhisperFeatureExtractor) + huggingface-hub
]

# WhisperSeg GPU variant — onnxruntime-gpu wheel is ~400 MB
# Install with: pip install whisperjav[whisperseg-gpu]
# Do NOT install alongside whisperseg; the -gpu package replaces the CPU one.
whisperseg-gpu = [
    "whisperjav[whisperseg]",
    "onnxruntime-gpu>=1.16.0",
]

# Qwen3-ASR support (v1.8.3+)
# Install with: pip install whisperjav[qwen]
# Note: Requires huggingface extra for transformers backend
qwen = [
    # v1.10.0 (item 3, owner W75, W76): the qwen-asr code from the WhisperJAV fork,
    # which runs on transformers 5 (upstream PR #125, a fix for upstream issue #218,
    # lower-bound pins, no demo programs). Same package name, so it replaces a PyPI
    # copy cleanly.
    "qwen-asr @ git+https://github.com/meizhong986/Qwen3-ASR.git@10cfb322e42c74cd75a6be622054c9becfeb3082",
    "whisperjav[huggingface]",  # Transformers/torch dependency
]

# Analysis and visualization tools
# Install with: pip install whisperjav[analysis]
# Note: scikit-learn is in [cli] for scene detection clustering
analysis = [
    "matplotlib",
    # Pillow: transitive via matplotlib, explicitly listed under [enhance] for modelscope
]

# pyvideotrans compatibility layer
# Install with: pip install whisperjav[compatibility]
compatibility = [
    "av>=13.0.0",
    "imageio>=2.31.0",
    "imageio-ffmpeg>=0.4.9",
    "httpx>=0.27.0",
    "websockets>=13.0",
    "soxr>=0.3.0",
]

# Development dependencies
# Install with: pip install whisperjav[dev]
dev = [
    "pytest>=7.0",
    "pytest-cov",
    "ruff>=0.1.0",
    "pre-commit",
    "build",  # v1.10.0 (item 2f): installer/build_release.py builds the wheel with it
]

# =============================================================================
# Combined Extras (Self-referencing)
# =============================================================================

# Full installation with all features
# Install with: pip install whisperjav[all]
all = [
    "whisperjav[cli,gui,translate,enhance,huggingface,qwen,analysis,compatibility]",
]

# Google Colab optimized (no GUI, focused on transcription + translation)
# Install with: %pip install whisperjav[colab]
colab = [
    "whisperjav[cli,translate,huggingface]",
]

# Kaggle optimized (similar to Colab)
# Install with: !pip install whisperjav[kaggle]
kaggle = [
    "whisperjav[cli,translate,huggingface]",
]

# Windows full experience (includes GUI)
# Install with: pip install whisperjav[windows]
windows = [
    "whisperjav[all]",
]

# Linux/macOS CLI-focused (no Windows GUI deps)
# Install with: pip install whisperjav[unix]
unix = [
    "whisperjav[cli,translate,enhance,huggingface,analysis,compatibility]",
]

# -----------------------------------------------------------------------------
# Entry Points (CLI Commands)
# -----------------------------------------------------------------------------
[project.scripts]
whisperjav = "whisperjav.main:main"
whisperjav-gui = "whisperjav.webview_gui.main:main"
whisperjav-translate = "whisperjav.translate.cli:main"
whisperjav-upgrade = "whisperjav.upgrade:main"
whisperjav-bench = "whisperjav.bench.cli:main"
whisperjav-accuracy-gate = "whisperjav.bench.regression_cli:main"

# -----------------------------------------------------------------------------
# Project URLs
# -----------------------------------------------------------------------------
[project.urls]
Homepage = "https://github.com/meizhong986/whisperjav"
Documentation = "https://github.com/meizhong986/whisperjav#readme"
Repository = "https://github.com/meizhong986/whisperjav.git"
Issues = "https://github.com/meizhong986/whisperjav/issues"
Changelog = "https://github.com/meizhong986/whisperjav/releases"

# -----------------------------------------------------------------------------
# Setuptools Configuration
# -----------------------------------------------------------------------------
[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.dynamic]
version = {attr = "whisperjav.__version__.__version__"}

[tool.setuptools.packages.find]
include = ["whisperjav*"]
exclude = ["tests*", "docs*", "installer*", "notebook*"]

[tool.setuptools.package-data]
whisperjav = [
    # v1.10.0 (N1): named one by one -- "config/*.json" also packed the
    # untracked asr_config.backup.*.json files lying in the working folder.
    "config/asr_config.json",
    "config/asr_config.pre_v189_cleanup.json",
    "config/asr_config_v1.6_beta.json",
    "config/asr_config_v1_5_4.json",
    "config/config.template.json",
    "config/ollama_models.json",
    "config/v4/**/*.yaml",
    "config/v4/**/*.md",
    "config/components/**/*.py",
    "translate/defaults/*.txt",
    "webview_gui/assets/*.html",
    "webview_gui/assets/*.css",
    "webview_gui/assets/*.js",
    "webview_gui/assets/*.ico",
    "Menu/*.json",
    "data/hallucination_filters/*.json",
    # v1.9.2: the three selectable Silero VAD builds (~4.7 MB, MIT). Shipped in
    # the wheel so --vad-version needs no download at install or run time --
    # required for users behind the Great Firewall.
    "assets/vad/*.onnx",
    "assets/vad/*.txt",
    "assets/vad/*.md",
    # v1.10.0 (item 2f): uv.lock exported per PyTorch build; whisperjav-upgrade
    # installs the new release's file from the wheel it has just installed.
    "installer/locked/requirements_*.txt",
]

# -----------------------------------------------------------------------------
# Tool Configuration: Ruff (Linter/Formatter)
# -----------------------------------------------------------------------------
[tool.ruff]
target-version = "py310"
line-length = 120
exclude = [
    ".git",
    ".ruff_cache",
    "__pycache__",
    "build",
    "dist",
    "*.egg-info",
    "installer/generated",
    ".venv",
    "venv",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "W",      # pycodestyle warnings
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument
    "B905",   # zip without strict
    "UP007",  # Use X | Y for type union (requires 3.10+)
]

[tool.ruff.lint.isort]
known-first-party = ["whisperjav"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

# -----------------------------------------------------------------------------
# Tool Configuration: Pytest
# -----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
markers = [
    "gated_model: tests that require gated HuggingFace model weights (HF_TOKEN required; skipped in CI)",
    "slow: tests that shell out to the real CLI (seconds each); deselect with -m 'not slow'",
]

# -----------------------------------------------------------------------------
# Tool Configuration: Coverage
# -----------------------------------------------------------------------------
[tool.coverage.run]
source = ["whisperjav"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/webview_gui/assets/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

# -----------------------------------------------------------------------------
# Tool Configuration: uv (Package Manager)
# -----------------------------------------------------------------------------
# v1.10.0 (item 2f): uv.lock is the one source of exact versions for development,
# source installs, the installer and upgrades. Pick the PyTorch build with its
# extra; never override an index (that re-resolves and rewrites uv.lock):
#   uv sync --frozen --extra all --extra cu130     (Windows default)
#   uv sync --frozen --extra all --extra cu128     (Windows fallback; Linux)
#   uv sync --frozen --extra all --extra vulkan    (Windows, GPU through Vulkan)
#   uv sync --frozen --extra all --extra cpu
# Own PyTorch: the platform's extra (Windows vulkan, else cpu) with
#   --inexact --no-install-package torch --no-install-package torchaudio
# installer/build_release.py exports the lock once per build to
# whisperjav/installer/locked/requirements_<variant>.txt (exact versions, no hashes).

[tool.uv]
# uv 0.9.26 made this lock and ships in the installer (installer/build_env.yml).
required-version = ">=0.9.26"
conflicts = [
    [{ extra = "cu130" }, { extra = "cu128" }, { extra = "vulkan" }, { extra = "cpu" }],
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true  # Only torch and torchaudio use these indexes, not numpy/scipy/etc.

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
# Each extra takes the two packages from its own index on every platform: uv
# 0.9.26 did not narrow an extra's source by platform marker (with markers, the
# exports still carried +cu130 for Linux and macOS). Which extra a platform uses
# is the installers' choice: Windows cu130, or cu128 as the fallback; Linux
# cu128 (owner, W45); no NVIDIA GPU and macOS cpu (that index carries the Apple
# Silicon wheels); vulkan takes PyTorch's CPU build, as cpu does.
torch = [
    { index = "pytorch-cu130", extra = "cu130" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cpu", extra = "vulkan" },
